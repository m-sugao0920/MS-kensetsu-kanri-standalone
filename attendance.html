<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作業員出面集計</title><link rel="stylesheet" href="cost_ledger.css?v=20261010-unified"><link rel="stylesheet" href="attendance.css?v=compact-20261011"><link rel="stylesheet" href="attendance_tabs.css?v=20261012"><script src="pages_boot.js" defer></script></head><body><header class="top no-print"><div class="top-inner"><div><div class="brand">MS建設管理システム</div><div class="sub">作業員出面集計</div></div><a class="home-btn" href="index.html">メイン画面に戻る</a></div></header><main><div class="page-head no-print"><div class="page-title"><h1>作業員出面集計</h1><p>条件を組み合わせて、作業員・現場・月別の実績を確認します。</p></div><a class="clear" href="office_entry.html">事務入力に戻る</a></div><h1 class="print-title">作業員出面集計</h1><section class="filters no-print"><div class="attendance-search-row"><label>表示方法<select id="mode"><option value="detail">出面明細（日付が縦）</option><option value="calendar">月別出面表（日付が横）</option><option value="site">現場別集計</option><option value="worker">作業員別集計</option><option value="month">月別集計</option></select></label><label id="detailOrderField">明細の並び順<select id="detailOrder"><option value="date">日付順</option><option value="worker">作業員別</option><option value="site">現場別</option></select></label><label>対象月<select id="month"></select></label><label>現場検索<input id="siteSearch" placeholder="工事番号・工事名"></label><label>現場<select id="site"></select></label><label>作業員<select id="worker"></select></label></div><div class="attendance-search-actions"><label class="check"><input id="showCost" type="checkbox">労務費を表示</label><button id="refresh" type="button">最新に更新</button><button id="print" type="button">A3横で印刷</button></div></section><p class="note">事務で登録した日報の実績だけを集計します。１日・半日は登録時の基準時間に対する割合です。出勤日数は同じ日に複数現場へ出ても１日、人工は実働時間 ÷ 登録時の基準時間の合計です。</p><h2 id="caption"></h2><p id="summary"></p><section id="dayDetails" class="day-details no-print" hidden><div class="day-heading"><h2 id="dayTitle"></h2><button type="button" id="closeDay">閉じる</button></div><div class="attendance-scroll"><table><thead id="dayHead"></thead><tbody id="dayRows"></tbody></table></div></section><p class="calendar-help no-print">月別出面表の日付を押すと、その日に誰がどの現場へ行ったかを確認できます。</p><div class="attendance-scroll"><table id="attendanceTable"><thead id="head"></thead><tbody id="body"></tbody><tfoot id="foot"></tfoot></table></div><p id="message" role="status"></p></main><script type="text/pages-deferred" src="shared_storage.js"></script><script type="text/pages-deferred" src="attendance_model.js?v=unified-20261010"></script><script type="text/pages-deferred" src="attendance.js?v=unified-20261010"></script><script type="text/pages-deferred" src="attendance_tabs.js?v=20261012"></script></body></html>
