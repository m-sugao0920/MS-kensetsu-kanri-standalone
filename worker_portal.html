<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作業指示・実績報告</title><link rel="stylesheet" href="worker_portal.css?v=unified-20261013"><script src="pages_boot.js?v=release-20261013" defer></script></head><body><header><div class="head"><div><div class="brand">MS建設管理システム</div><div class="sub">作業指示・作業報告</div></div><nav class="nav" aria-label="画面の移動"><a id="backToInstruction" href="work_instruction.html">作業指示書へ戻る</a><a href="dispatch_board.html">班割へ戻る</a><a href="index.html">メイン画面へ</a></nav></div></header><main><section class="search"><h2 class="panel-heading">指示書・現場を選択</h2><label>日付<input id="workerDate" type="date"></label><label>現場を検索<input id="workerSearch" placeholder="工事番号・工事名"></label><button id="refreshWorker" type="button">最新の内容に更新</button><p id="portalStatus" role="status"></p><div id="workerProjects"></div></section><section class="content"><div id="workerInstruction"><p>日付を選び、現場を開いてください。</p></div><div class="actions"><button id="showActual" type="button" disabled>作業報告を入力</button><button id="showInstruction" type="button" hidden>指示書を見る</button></div><form id="workerActual" hidden><h2>作業報告書</h2><p id="reportContext" class="report-context"></p><p>選択した指示書の予定を読み込んでいます。実際の作業内容・時間に直して送信してください。事務員が確認・登録するまでは出面・原価へ反映されません。</p><label>報告者<select id="workerReporter" required><option value="">報告する作業員を選択してください</option></select></label><div class="report-tabs" role="tablist" aria-label="作業報告の項目"><button type="button" id="tabPeople" role="tab" aria-controls="panelPeople" aria-selected="true" tabindex="0">人員 <span id="peopleCount"></span></button><button type="button" id="tabEquipment" role="tab" aria-controls="panelEquipment" aria-selected="false" tabindex="-1">重機・機械・車両 <span id="equipmentCount"></span></button><button type="button" id="tabWork" role="tab" aria-controls="panelWork" aria-selected="false" tabindex="-1">作業内容・報告</button></div>
<section id="panelPeople" role="tabpanel" aria-labelledby="tabPeople"><h3>作業員・実際の時刻</h3><div id="actualPeople"></div><button id="addActualWorker" type="button">＋ 作業員を追加</button></section>
<section id="panelEquipment" role="tabpanel" aria-labelledby="tabEquipment" hidden><h3>重機・機械・車両の使用実績</h3><div class="equipment-colors" aria-label="班割の色分け"><span class="heavy">重機</span><span class="machine">機械</span><span class="vehicle">車両</span></div><div id="actualMachines"></div><button id="addActualMachine" type="button">＋ 機械・車両を追加</button><h3>使用・納入の実績</h3><div id="actualArrangements"></div></section>
<section id="panelWork" role="tabpanel" aria-labelledby="tabWork" hidden><h3>作業内容・報告</h3><label>作業内容・出来高<textarea id="actualWorkNote" maxlength="10000"></textarea></label><label>指示事項への報告・追加事項<textarea id="actualExtraNote" maxlength="10000"></textarea></label></section>
<div class="report-submit"><label class="check"><input id="workerConfirmed" type="checkbox" required>実際の時刻・休憩・使用状況を確認しました</label><div class="actions"><button type="submit" id="sendWorkerReport">報告を完了・日報へ送る</button></div><p id="workerReportMessage" role="status"></p></div></form></section></main><script type="text/pages-deferred" src="dispatch_model.js"></script><script type="text/pages-deferred" src="instruction_schedule.js?v=20261009"></script><script type="text/pages-deferred" src="purchase_form_helpers.js"></script><script type="text/pages-deferred" src="instruction_arrangements.js?v=20261010"></script><script type="text/pages-deferred" src="worker_report_tabs.js?v=20261013"></script><script type="text/pages-deferred" src="worker_portal.js?v=reporter-picker-20261013"></script></body></html>
