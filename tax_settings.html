<!doctype html><html lang="ja"><meta charset="utf-8"><title>消費税設定</title><style>body{font-family:Meiryo;background:#eef6fb}main{max-width:700px;margin:35px auto;background:white;padding:25px}td{padding:6px}input,select,button{padding:8px}button{margin:10px}#status{white-space:pre-wrap}</style><script type="text/pages-deferred" src="shared_storage.js"></script><script type="text/pages-deferred" src="tax.js"></script><script type="text/pages-deferred" src="ms_data.js?v=tax20261003"></script><main><h1>消費税率・端数処理</h1><p>税抜で入力し、総額は税込で表示します。設定変更は新しい記録の初期値に適用します。保存済みの記録の税率は変わりません。適用開始日は初期値を切り替える日で、制度上の適用判断は各記録で確認してください。</p><table><thead><tr><th>適用開始日</th><th>税率（％）</th><th></th></tr></thead><tbody id="rates"></tbody></table><button id="add">税率を追加</button><label>端数処理 <select id="rounding"><option value="floor">切捨て</option><option value="round">四捨五入</option><option value="ceil">切上げ</option></select></label><button id="save">設定を保存</button><a href="kanri_settei.html">管理・設定へ戻る</a><div id="status"></div></main><script type="text/pages-deferred">const p=MSTax.policy(),body=document.getElementById('rates');function row(r){const tr=document.createElement('tr');tr.innerHTML='<td><input type="date"></td><td><input type="number" min="0" max="100" step="0.1"></td><td><button>削除</button></td>';const inputs=tr.querySelectorAll('input');inputs[0].value=r.from;inputs[1].value=r.rate;tr.querySelector('button').onclick=()=>tr.remove();body.append(tr)}p.rates.forEach(row);document.getElementById('rounding').value=p.rounding;document.getElementById('add').onclick=()=>row({from:MSTax.today(),rate:10});document.getElementById('save').onclick=()=>{try{const rates=Array.from(body.children).map(tr=>{const a=tr.querySelectorAll('input');return {from:a[0].value,rate:Number(a[1].value)}});if(!rates.length||rates.some(r=>!/^\d{4}-\d{2}-\d{2}$/.test(r.from)||!Number.isFinite(r.rate)||r.rate<0||r.rate>100)||new Set(rates.map(r=>r.from)).size!==rates.length)throw Error('開始日と税率を確認してください。同じ日を重複登録できません。');const meta=JSON.parse(MSShared.getItem('mscm:v1:meta')||'{}');meta.taxPolicy={rates,rounding:document.getElementById('rounding').value};MSShared.setItem('mscm:v1:meta',JSON.stringify(meta));document.getElementById('status').textContent='保存しました。各PCで画面を開き直してください。'}catch(e){document.getElementById('status').textContent=e.message}}</script></html>
