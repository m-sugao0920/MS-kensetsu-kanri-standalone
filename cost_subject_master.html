<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科目マスター</title><link rel="stylesheet" href="purchase_layout.css"><link rel="stylesheet" href="management_master.css?v=20261012b"><script src="pages_boot.js" defer></script></head><body><header><div class="master-top"><div class="master-brand">MS建設管理システム　／　管理・設定</div><a href="kanri_settei.html">管理・設定に戻る</a></div></header><main><h1>科目マスター</h1><p class="master-lead">科目名、集計区分、表示順、使用状態を管理します。</p><p class="note">番号・科目名・表示順・使用状態を管理します。集計区分は原価台帳の材料費・労務費・外注費・経費のどこに含めるかを指定します。</p><section class="panel"><h2>一覧・編集<span class="master-tools"><button type="button" id="addSubject">新規登録</button></span></h2><form id="masterForm"><div class="scroll"><table class="draft-table"><thead><tr><th>番号</th><th>科目名</th><th>集計区分</th><th>表示順</th><th>使用状態</th></tr></thead><tbody id="subjects"></tbody></table></div><div class="actions"><button type="submit" class="primary">保存</button><button type="button" class="sub" onclick="location.reload()">キャンセル</button></div></form><p id="message" role="status"></p><p class="muted">使用済みの科目は名称・集計区分を変更できません。使わなくなった科目は「休止」にしてください。請求入力へ反映するには、入力内容を保存してから画面を更新してください。</p></section></main><script type="text/pages-deferred" src="shared_storage.js"></script><script type="text/pages-deferred" src="cost_subject_master.js"></script></body></html>
