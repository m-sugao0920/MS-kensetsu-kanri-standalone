<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>デモ版の保存について</title><style>body{font:16px Meiryo,sans-serif;color:#111;background:#f3f8fc;padding:24px;line-height:1.8}main{max-width:800px;margin:auto;background:white;padding:24px;border-radius:10px}a{color:#176fa8}</style><main><h1>デモ版の保存について</h1><p>この版はブラウザーで試すためのデモです。PC1・PC2の共有接続設定は必要ありません。</p><p>62工事の架空データから始まります。変更した内容は、このブラウザーに保存します。別のPCやブラウザーには共有されません。</p><p>初回の読み込みにはインターネット接続が必要です。Pythonをインストールする必要はありません。</p><p>データを残すには「システム・データ設定」のバックアップを書き出してください。ブラウザーの保存データを消すと、入力内容も消えます。PDF添付は業務データのバックアップには含まれません。</p><a href="index.html" target="_top">メイン画面へ戻る</a></main></html>
