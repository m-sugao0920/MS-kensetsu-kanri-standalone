  doc.querySelectorAll('a[href="kanri_settei.html"],button[onclick]').forEach(e=>{if(e.tagName==='A'||(e.getAttribute('onclick')||'').includes("location.href='kanri_settei.html'"))e.hidden=true;});

  function resize(){if(main)frame.style.height=Math.ceil(main.getBoundingClientRect().height+30)+'px';}

 });}
