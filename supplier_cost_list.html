<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仕入・下請の請求確認</title><link rel="stylesheet" href="purchase_layout.css"><link rel="stylesheet" href="supplier_cost_list.css?v=column-fix-20261006"><link rel="stylesheet" href="billing_common.css?v=one-row-final2-20261010"><script src="pages_boot.js" defer></script></head>
<body><header><div class="head"><div><div class="brand">MS建設管理システム</div><div class="sub">仕入・下請の請求確認</div></div><nav class="nav"><a href="supplier_cost_entry.html">仕入・下請請求入力へ</a><a href="office_entry.html">事務入力へ戻る</a></nav></div></header>
<main><p class="page-note">業者から届いた請求書を、期間・工事・業者ごとに確認します。登録・修正は「仕入・下請請求入力」で行います。</p><section class="summary-band billing-summary" aria-label="検索結果の合計" aria-live="polite"><div><span>該当する請求書</span><strong id="countTotal">0件</strong></div><div><span>税抜合計</span><strong id="netTotal">0円</strong></div><div><span>消費税</span><strong id="taxTotal">0円</strong></div><div><span>税込合計</span><strong id="grossTotal">0円</strong></div></section>
<div class="list-workspace billing-workspace"><aside><form id="searchForm" class="panel"><h2>検索条件</h2><div class="search-fields billing-search-fields">
<div><label for="period">期間の選び方</label><select id="period"><option value="month">月別</option><option value="three">３か月（開始月を指定）</option><option value="quarter">四半期</option><option value="year">年別・年度別</option><option value="custom">日付を指定</option><option value="all">全期間</option></select></div>
<div id="monthField"><label id="monthLabel" for="month">請求月</label><input id="month" type="month" required></div>
<div id="yearFields" hidden><label for="year">開始年</label><input id="year" type="number" min="1900" max="9998" required><label for="fiscalStart">年・年度の開始月</label><select id="fiscalStart"></select><div id="quarterField"><label for="quarter">四半期</label><select id="quarter"><option value="1">第１四半期</option><option value="2">第２四半期</option><option value="3">第３四半期</option><option value="4">第４四半期</option></select></div></div>
<div id="dateFields" hidden><label for="startDate">開始日</label><input id="startDate" type="date" required><label for="endDate">終了日</label><input id="endDate" type="date" required></div>
<div><label for="projectFilter">工事番号・工事名</label><input id="projectFilter" list="projectChoices" placeholder="空欄で全工事" autocomplete="off"><datalist id="projectChoices"></datalist></div>
<div><label for="supplierFilter">業者番号・会社名</label><input id="supplierFilter" list="supplierChoices" placeholder="空欄で全業者" autocomplete="off"><datalist id="supplierChoices"></datalist></div>
<div><label for="subjectFilter">科目</label><select id="subjectFilter"><option value="">すべての科目</option></select></div>
<div><label for="keyword">内容・請求書番号</label><input id="keyword" placeholder="キーワードで検索"></div>
<div><label for="groupBy">一覧の表示方法</label><select id="groupBy"><option value="invoice">請求書別</option><option value="project">工事別</option><option value="supplier">業者別</option><option value="subject">科目別</option></select></div>
</div><div class="actions"><button type="submit" class="primary">検索する</button><button type="button" id="resetFilters">条件をリセット</button></div><p class="muted">請求日で集計します。条件を変えると一覧と合計が更新されます。</p><p id="message" role="alert"></p></form></aside>
<section class="panel results-panel"><h2 id="resultsHeading">登録済みの請求一覧</h2><p id="rangeNote" class="results-note"></p><p class="results-note">工事・科目・内容で絞った場合、金額は該当する明細分です。消費税は請求書の税額を明細金額に応じて配分しています。</p><div id="costHistory"></div><p id="empty" class="list-note" hidden>条件に合う請求はありません。</p></section></div></main>
<script type="text/pages-deferred" src="purchase_form_helpers.js"></script><script type="text/pages-deferred" src="supplier_cost_list_model.js?v=20261006"></script><script type="text/pages-deferred" src="supplier_cost_list.js?v=one-row-final2-20261010"></script></body></html>
