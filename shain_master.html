<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>社員マスター</title>
<style id="ms-no-flicker">
/* 初期データ反映前のテンプレートちらつき防止。レイアウト値は変更しない */
html.ms-app-loading body{visibility:hidden}
</style>
<script type="text/pages-deferred" id="ms-no-flicker-start">
document.documentElement.classList.add('ms-app-loading');
window.addEventListener('load',function(){
  requestAnimationFrame(function(){
    document.documentElement.classList.remove('ms-app-loading');
  });
},{once:true});
</script>

<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f4f7f8;color:#24333d}
header{background:#284b5b;color:#fff;padding:16px 20px}header h1{font-size:22px;margin:0}.wrap{max-width:1100px;margin:18px auto;padding:0 14px}
.card{background:#fff;border:1px solid #d7e0e4;border-radius:10px;margin-bottom:14px;overflow:hidden}.hd{background:#eaf0f2;padding:10px 14px;font-weight:800}.bd{padding:14px}
.grid{display:grid;grid-template-columns:170px 1fr 170px 1fr;gap:10px 12px;align-items:center}label{font-weight:700}
input,select{width:100%;padding:9px;border:1px solid #b9c6cc;border-radius:6px;font-size:15px}input[readonly]{background:#eef3f5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:6px;padding:9px 15px;background:#315d70;color:#fff;font-weight:800;cursor:pointer}button.sub{background:#6e7e86}button.warn{background:#946b25}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #dfe6e9;padding:9px;text-align:left}th{background:#f2f5f6}tr:hover{background:#f8fbfc}
.note{font-size:13px;color:#657780}.mode{font-weight:800;margin-left:10px;padding:3px 8px;border-radius:12px;background:#fff1c9;color:#765700;font-size:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style><style id="master-layout">
body{background:#f3f7fa;color:#263f50;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Meiryo",sans-serif}header{background:#fff;color:#174d78;padding:0;border-bottom:1px solid #cbdbe6}.top{max-width:1380px;margin:auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:22px;font-weight:900}.wrap{max-width:1100px;margin:0 auto;padding:24px 28px}h1{font-size:28px;color:#174d78;margin:0 0 8px}.lead{font-size:13px;color:#71818c;line-height:1.7;margin:0 0 20px}.card{border:1px solid #cbdbe6;border-radius:12px;margin-bottom:18px}.hd{background:#edf4f9;color:#174d78;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.bd{padding:18px}.grid{grid-template-columns:120px 1fr 120px 1fr}button{background:#174d78;border-radius:8px;padding:10px 16px;margin-right:0}button.sub{background:#fff;color:#174d78;border:1px solid #a8c0d2}button.warn{background:#fff9e9;color:#795e27;border:1px solid #e2cf95}.actions{gap:10px;border-top:1px solid #e1eaf0;padding-top:16px}input,select{border-color:#b9cbd8}input:focus,select:focus,button:focus-visible{outline:2px solid #4287b9;outline-offset:2px}th{background:#edf4f9;color:#174d78}td,th{padding:12px}.note{line-height:1.7}.empty{text-align:center;color:#71818c;padding:24px}.count{font-size:13px;font-weight:400}.table-scroll{overflow:auto;max-height:400px}.table-scroll table{min-width:580px}.status-note{font-size:13px;color:#607583;margin:12px 0 0}@media(max-width:760px){.top{padding:16px;align-items:flex-start;flex-wrap:wrap}.brand{font-size:18px}.wrap{padding:20px 16px}.grid{grid-template-columns:1fr}h1{font-size:24px}.hd{flex-wrap:wrap}}
</style><script src="pages_boot.js" defer></script></head>
<body><header><div class="top"><div class="brand">MS建設管理システム　／　管理・設定</div><button onclick="masterBack()">管理・設定に戻る</button></div></header>
<div class="wrap"><h1>社員・担当者マスター<span id="mode" class="mode"></span></h1><p class="lead">社員・担当者の登録、所属・役職、在籍状態を管理します。</p>
<div class="card"><div class="hd">検索・一覧 <span id="recordCount" class="count"></span><button onclick="newRec();document.getElementById('editor').scrollIntoView({behavior:'smooth'});">新規登録</button></div><div class="bd">
<div class="grid"><label>検索</label><input id="q" placeholder="番号・氏名・所属・役職で検索" oninput="render()"><label>表示</label><select id="filter" onchange="render()"><option value="all">すべて</option><option value="active">在籍</option><option value="inactive">退職</option></select></div>
<div class="table-scroll" style="margin-top:12px"><table><thead><tr><th>番号</th><th>氏名</th><th>表示順</th><th>状態</th><th>更新日時</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div><p class="status-note">一覧の行を選ぶと、下の編集欄に表示します。</p><div class="card" id="editor"><div class="hd">登録・編集</div><div class="bd">
<p class="note">社員・担当者を登録します。退職者は削除せず「退職」にして履歴を残します。　試作中に登録した社員データは、本番開始時にリセットします。</p>
<div class="grid">
<label>社員番号</label><input id="no" readonly>
<label>氏名 <span style="color:#a33">*</span></label><input id="name" maxlength="80">
<label>表示順</label><input id="sortOrder" type="number" min="0" step="1" value="10">
<label>状態</label><select id="status"><option value="active">在籍</option><option value="inactive">退職</option></select>
<label>所属</label><input id="department" maxlength="50">
<label>役職</label><input id="position" maxlength="50">
</div>
<div class="actions"><button onclick="saveRec()">保存</button><button class="sub" onclick="masterCancel()">キャンセル</button><button class="warn" onclick="toggleActive()">在籍／退職を切替</button></div>
</div></div></div>
<script type="text/pages-deferred" src="shared_storage.js"></script>
<script type="text/pages-deferred" src="tax.js?v=20261003"></script><script type="text/pages-deferred" src="ms_data.js?v=tax20261003"></script><script type="text/pages-deferred">
let editingId=null;
const elNo=document.getElementById('no'), elName=document.getElementById('name');
const elSort=document.getElementById('sortOrder'), elStatus=document.getElementById('status');
const elDepartment=document.getElementById('department'), elPosition=document.getElementById('position');
const elQ=document.getElementById('q'), elFilter=document.getElementById('filter');
const elRows=document.getElementById('rows'), elMode=document.getElementById('mode');

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').replace(/[\s　]/g,'').toLowerCase()}
function newRec(){
 if(masterBaseline && !masterAllowLeave())return;
  editingId=null; elNo.value=MSData.peekNo('employees'); elName.value='';
  const used=MSData.all('employees').map(x=>Number(x.sortOrder)||0);
  elSort.value=used.length?Math.ceil((Math.max(...used)+1)/10)*10:10;
  elStatus.value='active'; elDepartment.value=''; elPosition.value=''; elName.focus();
 masterMarkClean();
}
function saveRec(){
 try{
  const nm=elName.value.trim(); if(!nm){alert('氏名を入力してください。');elName.focus();return}
  const dup=MSData.all('employees').find(x=>x.id!==editingId && norm(x.name)===norm(nm));
  if(dup && !confirm('同じ氏名「'+dup.name+'」が登録されています。\nそれでも保存しますか？')) return;
  const obj={id:editingId||undefined,no:editingId?elNo.value:undefined,name:nm,
    sortOrder:Number(elSort.value||0),status:elStatus.value,
    department:elDepartment.value.trim(),position:elPosition.value.trim()};
  const saved=MSData.save('employees',obj);
  editingId=saved.id; elNo.value=saved.no; render(); masterMarkClean(); alert('保存しました。');
 }catch(e){console.error(e);alert('保存できませんでした。\n'+(e?.message||e))}
}
function editRec(id){
 if(!masterAllowLeave())return;
 const r=MSData.get('employees',id); if(!r)return;
 editingId=id; elNo.value=r.no||''; elName.value=r.name||''; elSort.value=r.sortOrder??10;
 elStatus.value=r.status||'active'; elDepartment.value=r.department||''; elPosition.value=r.position||'';
 document.getElementById('editor').scrollIntoView({behavior:'smooth'}); masterMarkClean();
}
function toggleActive(){
 if(!masterAllowLeave())return;
 if(!editingId){alert('一覧から対象を選択してください。');return}
 const r=MSData.get('employees',editingId); r.status=r.status==='inactive'?'active':'inactive';
 MSData.save('employees',r); masterMarkClean(); editRec(r.id); render();
 masterMarkClean();
}
function render(){
 const key=norm(elQ.value),f=elFilter.value;
 const data=MSData.all('employees').filter(r=>(f==='all'||r.status===f)&&(!key||norm((r.no||'')+' '+(r.name||'')+' '+(r.department||'')+' '+(r.position||'')).includes(key)))
 .sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)||(a.no||'').localeCompare(b.no||''));
 document.getElementById('recordCount').textContent=data.length+'件';
 elRows.innerHTML=data.map(r=>`<tr onclick="editRec('${r.id}')" style="cursor:pointer"><td>${esc(r.no)}</td><td><b>${esc(r.name)}</b></td><td>${r.sortOrder??''}</td><td>${r.status==='inactive'?'退職':'在籍'}</td><td>${esc((r.updatedAt||'').replace('T',' ').slice(0,16))}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">該当する登録はありません。</td></tr>';
}
window.addEventListener('load',()=>{elMode.textContent=MSData.getMode()==='production'?'本番運用':'試作モード';newRec();render();});
</script><script type="text/pages-deferred">
let masterBaseline='';
function masterValues(){return JSON.stringify(Array.from(document.querySelectorAll('#editor input,#editor select,#rows input[type=checkbox],#amendBox input,#amendBox select')).map(e=>[e.id||e.dataset.key,e.type==='checkbox'?e.checked:e.value]));}
function masterMarkClean(){masterBaseline=masterValues();}
function masterAllowLeave(){return masterValues()===masterBaseline||confirm('未保存の変更があります。変更を破棄しますか？');}
function masterBack(){if(masterAllowLeave()){masterMarkClean();location.href='kanri_settei.html';}}
function masterCancel(){if(!masterAllowLeave())return;masterMarkClean();if(typeof newRec==='function')newRec();else{render();document.querySelectorAll('#amendBox input').forEach(e=>e.value='');masterMarkClean();}}
window.addEventListener('beforeunload',e=>{if(masterValues()!==masterBaseline){e.preventDefault();e.returnValue='';}});
window.addEventListener('load',()=>{masterMarkClean();window.scrollTo(0,0);});
</script></body></html>
